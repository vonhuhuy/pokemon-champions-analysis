name: Update Competitive Database

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (midnight)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from the GitHub Actions tab
    inputs:
      force_stats:
        description: 'Force refetch all species base stats from web'
        required: false
        type: boolean
        default: false
      export_only:
        description: 'Only export JSON files from SQLite source of truth (no scraping)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: update-database
  cancel-in-progress: true

jobs:
  update-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run competitive database update pipeline
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.force_stats }}" = "true" ]; then
            EXTRA_ARGS="--force-stats"
          fi
          if [ "${{ inputs.export_only }}" = "true" ]; then
            EXTRA_ARGS="--export-only"
          fi
          python3 scripts/update_database.py $EXTRA_ARGS

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "Competitive data updates detected. Staging and committing..."
            git add data/
            git commit -m "chore(data): automated daily competitive database update [skip ci]"
            git push
            echo "Successfully committed and pushed updated database."
          else
            echo "No database changes detected. Everything is up to date."
          fi
